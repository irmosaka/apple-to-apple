<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اپل‌تو‌اپل | مقایسه محصول به محصول</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="logo">
        <span class="logo-icon">⚖️</span>
        <h1>اپل‌تو‌اپل</h1>
      </div>
      <nav>
        <a href="index.html" class="active">مقایسه</a>
        <a href="admin.html">داشبورد مدیریت</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>مقایسه دقیق محصول به محصول</h2>
      <p>محصول خودت رو با رقیب از دیجی‌کالا مقایسه کن و ببین کجا برتری داری</p>
    </section>

    <section class="compare-controls">
      <div class="select-group">
        <label for="productA">محصول اول (محصول خودت)</label>
        <select id="productA">
          <option value="">انتخاب کنید...</option>
        </select>
      </div>
      <div class="vs-badge">VS</div>
      <div class="select-group">
        <label for="productB">محصول دوم (رقیب)</label>
        <select id="productB">
          <option value="">انتخاب کنید...</option>
        </select>
      </div>
    </section>

    <section id="comparisonResult" class="comparison-result hidden">
      <!-- مقایسه اینجا رندر می‌شه -->
    </section>

    <section id="emptyState" class="empty-state">
      <div class="empty-icon">📊</div>
      <h3>دو محصول انتخاب کن تا مقایسه شروع بشه</h3>
      <p>از منوی بالا محصول خودت و رقیب رو انتخاب کن</p>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>ساخته شده برای مقایسه شفاف و عادلانه محصولات</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
