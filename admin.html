<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داشبورد مدیریت | اپل‌تو‌اپل</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="logo"><span class="logo-icon">⚖️</span><h1>اپل‌تو‌اپل</h1></div>
      <nav>
        <a href="index.html">مقایسه</a>
        <a href="admin.html" class="active">داشبورد مدیریت</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <div class="admin-header">
      <h2>مدیریت محصولات</h2>
      <button class="btn btn-primary" onclick="openAddModal()">+ افزودن محصول جدید</button>
    </div>
    <div class="export-box">
      <p><strong>نکته:</strong> برای دائمی شدن، Export کن و جایگزین data/products.json کن.</p>
      <div class="export-actions">
        <button class="btn btn-success" onclick="exportJSON()">⬇ Export JSON</button>
        <button class="btn btn-outline" onclick="importJSON()">⬆ Import JSON</button>
        <button class="btn btn-primary" id="btnRefreshAllPrices" onclick="refreshAllPrices()">🔄 به‌روزرسانی همه قیمت‌ها</button>
      </div>
    </div>
    <div id="productList" class="product-list"></div>
  </main>
  <div class="modal-overlay" id="productModal">
    <div class="modal">
      <div class="modal-header"><h3 id="modalTitle">افزودن محصول</h3><button class="modal-close" onclick="closeModal()">×</button></div>
      <form id="productForm">
        <div class="modal-body">
          <div class="form-group"><label>نام *</label><input type="text" name="name" required></div>
          <div class="form-row">
            <div class="form-group"><label>برند</label><input type="text" name="brand"></div>
            <div class="form-group"><label>قیمت</label><input type="number" name="price"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>نوع</label><select name="type"><option value="own">محصول من</option><option value="competitor">رقیب</option></select></div>
            <div class="form-group"><label>دسته</label><div style="display:flex;gap:6px"><select name="category" style="flex:1"></select><button type="button" class="btn btn-outline btn-sm" onclick="addNewCategory()">+</button></div></div>
          </div>
          <div class="form-group"><label>تصویر</label><input type="url" name="image"></div>
          <div class="form-group"><label>لینک دیجی‌کالا</label><div style="display:flex;gap:8px"><input type="url" name="digikalaUrl" style="flex:1"><button type="button" class="btn btn-primary btn-sm" onclick="tryFetchDigikala()">دریافت از دیجی‌کالا</button></div></div>
          <div class="form-group" id="competitorsSection"><label>رقبا</label><div id="competitorsSelectContainer" class="competitors-box"></div></div>
          <div class="form-group"><label>ویژگی‌ها</label><div class="features-editor"><div id="featuresContainer"></div><button type="button" class="btn btn-outline btn-sm" onclick="addFeatureRow()">+ ویژگی</button></div></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-outline" onclick="closeModal()">انصراف</button><button type="submit" class="btn btn-primary">ذخیره</button></div>
      </form>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="js/digikala.js"></script>
  <script src="js/app-part1.js"></script>
  <script src="js/app-part2.js"></script>
</body>
</html>
